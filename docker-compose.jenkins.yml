services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: local_jenkins
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/local-repo

volumes:
  jenkins_home:
